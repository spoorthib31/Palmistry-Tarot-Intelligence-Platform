version: '3.8'

services:
  # =========================================================================
  # FastAPI Spiritual Intelligence Backend (Palmistry, Tarot, Oracle, PDF)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mystic-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Palmistry & Tarot Intelligence Platform
      - PROJECT_VERSION=1.0.0
      - SECRET_KEY=cosmic-spiritual-secret-key-super-secure-jwt-2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DATABASE_URL=sqlite:////app/data/spiritual_platform.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - palm_uploads:/app/uploads
      - spiritual_reports:/app/generated_reports
      - spiritual_db:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - spiritual-net

  # =========================================================================
  # React + Vite Production Frontend with Nginx Reverse Proxy
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mystic-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - spiritual-net

volumes:
  palm_uploads:
    name: mystic_palm_uploads
  spiritual_reports:
    name: mystic_spiritual_reports
  spiritual_db:
    name: mystic_spiritual_db

networks:
  spiritual-net:
    name: mystic_spiritual_network
    driver: bridge
